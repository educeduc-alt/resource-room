<header class="top">
  <div class="wrap">
    <div class="brand"><b>資源教室借用系統</b><span>弘光科技大學・空間器材線上預借、登記與滿意度</span></div>
    <nav class="tabs" id="nav" aria-label="主要功能"></nav>
  </div>
</header>
<main class="wrap" id="view" tabindex="-1"><p class="note">載入中…</p></main>
<footer class="wrap">申請借用／歸還：星期一至星期五 08:00–20:00（寒暑假依學校辦公時間調整）。資源教室內電腦 4 台、印表機、影印機、掃描機可直接使用，不需申請，使用時請到<a href="#usage">設備使用登記</a>登記。<span id="office"></span></footer>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* Google 試算表資料庫網址（Apps Script 網頁應用程式）。留空 = 展示版，資料只存在瀏覽器。 */
const API_URL='https://script.google.com/macros/s/AKfycby-Ejb2weptdOCqGR6JFbrd9mAToo09d10haGf_8-K3kR4L7WqlXulmDNUazSXRAxCv/exec';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const dow=s=>new Date(s+'T00:00:00').getDay();
const WD='日一二三四五六';
const fmtDate=s=>s?`${s.slice(5).replace('-','/')}（${WD[dow(s)]}）`:'';
const nowStr=()=>{const d=new Date();return ymd(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const local={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const toast=(m)=>{const t=$('#toast');t.textContent=m;clearTimeout(toast._t);toast._t=setTimeout(()=>t.textContent='',3200)};
const queues={};
const serial=(key,fn)=>{const p=(queues[key]||Promise.resolve()).then(fn);queues[key]=p.catch(()=>{});return p};
const TIMES=[];for(let m=8*60;m<=20*60;m+=30)TIMES.push(pad(Math.floor(m/60))+':'+pad(m%60));
const overlap=(a1,a2,b1,b2)=>a1<b2&&b1<a2;
function normDate(v){
  if(v==null||v==='')return '';
  if(v instanceof Date&&!isNaN(v))return ymd(v);
  const s=String(v).trim();
  const m=s.match(/^(\d{2,4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);
  if(!m)return s;
  let y=+m[1]; if(y<1911)y+=1911;
  return y+'-'+pad(+m[2])+'-'+pad(+m[3]);
}

/* ---------- constants ---------- */
const TYPES={item:'一般性器材',leisure:'休閒性器材',space:'空間借用',long:'長期借用'};
const CATS={general:'一般性器材・當天歸還',general3:'一般性器材・3 天內歸還',leisure:'休閒性器材',space:'空間'};
const STATUS={pending:['待審核','warn'],approved:['已核准・待領取','ok'],rejected:['不同意','bad'],out:['借出中','info'],returning:['已確認歸還・待老師點收','info'],returned:['已歸還',''],cancelled:['已取消','']};
const Q=[['q1','空間環境整潔、舒適'],['q2','器材設備狀況良好'],['q3','借用流程方便、清楚'],['q4','老師與工讀生的協助'],['q5','整體滿意度']];
const SCALE=['非常不滿意','不滿意','普通','滿意','非常滿意'];
const SCALE_COLORS=['var(--bad)','var(--warn)','var(--line)','var(--info)','var(--ok)'];
const SURVEY_TARGETS=['悅讀書房','課輔室','資源教室器材借用','休閒性器材','資源教室整體服務'];

/* ---------- state ---------- */
const S={db:null,user:null,uid:null,admin:false,ready:false,noDb:false,
  catalog:[],config:{},calendar:[],myReq:[],mySurveys:[],allReq:[],loans:[],roster:[],surveys:[],
  got:{},notes:{},preselect:null,stale:false};
const chipFor=st=>{const [t,c]=STATUS[st]||[st,''];return `<span class="chip ${c}">${h(t)}</span>`};
const item=code=>S.catalog.find(c=>c.code===code);
const rosterMap=()=>Object.fromEntries(S.roster.map(r=>[String(r.no).toUpperCase(),r]));
function weekOf(date){const st=S.config.semesterStart;if(!st)return null;return Math.floor((new Date(date+'T00:00:00')-new Date(st+'T00:00:00'))/864e5/7)+1}
function leisureSlot(date){const w=weekOf(date);if(w==null)return null;if(w===10||w===11)return{label:`期中考週（第 ${w} 週）`,start:'18:00',end:'20:00'};if(w===19)return{label:'期末考週（第 19 週）',start:'10:00',end:'15:00'};return false}
function eventOn(date){return (S.config.eventDays||[]).find(e=>e.date===date)}
function dueFor(r){const it=item(r.code);if(r.type==='long')return r.endDate||r.date;if(it&&it.cat==='general3')return addDays(r.date,3);return r.date}
const allRequests=()=>S.allReq.flatMap(d=>(d.list||[]).map(r=>({...r,uid:d.id})));

/* ---------- views ---------- */
const STUDENT_TABS=[['rules','借用規定'],['apply','申請借用'],['mine','學生/職員申請']];
const ADMIN_TABS=[['review','審核與點交'],['ledger','設備借用紀錄'],['usagelog','設備使用紀錄'],['stats','滿意度統計'],['setup','設定']];
let curView=null,curParam=null;
function navHtml(){
  const r=['borrow','usage','items','item'].includes(curView)?'apply':curView==='survey'?'mine':curView;
  let s=STUDENT_TABS.map(([k,t])=>`<a href="#${k}" ${r===k?'aria-current="page"':''}>${t}</a>`).join('');
  if(S.admin)s+=`<span class="sep"></span><span class="grp">資源教室</span>`+ADMIN_TABS.map(([k,t])=>`<a href="#${k}" ${r===k?'aria-current="page"':''}>${t}</a>`).join('')+`<a href="#logout">登出</a>`;
  else s+=`<span class="sep"></span><a href="#login" ${r==='login'?'aria-current="page"':''}>資源教室登入</a>`;
  return s;
}
function route(){
  let r=(location.hash||'#rules').slice(1)||'rules',p=null;
  if(r.startsWith('item-')){p=r.slice(5);r='item'}
  if(r==='logout'){logout();return}
  if(!V[r])r='apply';
  if(r!=='survey')S.surveyFor=null;
  if(ADMIN_TABS.some(t=>t[0]===r)&&S.ready&&!S.admin){S.after=r;r='login'}
  if(r==='login'&&S.admin){location.hash='review';return}
  curView=r;curParam=p;
  $('#nav').innerHTML=navHtml();
  const v=V[r];
  $('#view').innerHTML=v.shell(p);
  v.bind&&v.bind(p);
  v.paint&&v.paint(p);
  setTimeout(maybeSurveyPopup,300);
}
let lastNavRefresh=0;
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0);if(S.db&&S.db.refresh&&Date.now()-lastNavRefresh>2500){lastNavRefresh=Date.now();S.db.refresh()}});
function repaint(keys){
  $('#nav').innerHTML=navHtml();
  const o=$('#office');o.textContent=S.config.office?`　聯絡：${S.config.office}`:'';
  const v=V[curView];if(!v)return;
  if(v.deps&&!v.deps.some(k=>keys.includes(k)))return;
  if(curView==='review'||curView==='ledger'||curView==='roster'||curView==='stats'||curView==='setup'||curView==='usagelog'){
    if(!S.ready)return;
    if(ADMIN_TABS.some(t=>t[0]===curView)&&!S.admin){location.hash='login';return}
  }
  v.paint&&v.paint(curParam);
}
function gateNotice(){
  if(S.noDb)return `<div class="note warn">這個頁面目前無法連線到資料庫。請登入 claude.ai 並從資源教室提供的連結開啟；若仍看到此訊息，請向資源教室老師確認你的分享權限（需為「參與者」以上）。</div>`;
  if(S.offline)return `<div class="note warn">目前連不上資料庫，畫面可能不是最新的。請檢查網路後重新整理。</div>`;
  if(S.ready&&!S.uid&&!S.gas)return `<div class="note warn">無法辨識你的帳號，因此無法送出申請。請先登入後再開啟此頁。</div>`;
  if(S.stale)return `<div class="note">資料連線較慢，目前顯示的內容可能不是最新的。</div>`;
  return '';
}

  qr(){const box=$('#a-qr');if(!box)return;const u=(S.config.url||'').replace(/#.*$/,'');

  detail(reset){

    const idKey=staffRole?ap.name:ap.no;
    if(S.gas&&idKey&&ap.phone){const before=S.uid;await setIdentity(idKey,ap.phone,ap.name);if(before!==S.uid){const sn=await S.db.doc('requests/'+S.uid).get().catch(()=>null);S.myReq=sn&&sn.exists?(sn.data().list||[]):[]}}
    if(!S.db||!S.uid)return fail(S.gas?(staffRole?'請先填寫姓名與聯絡電話。':'請先填寫學號與聯絡電話。'):'目前無法送出：請登入後從資源教室提供的連結開啟此頁。');
    if(S.myReq.some(needSurvey))return fail('你有已歸還的借用尚未填寫滿意度問卷，請先到「學生/職員申請」填寫後再送出新的申請。');
    if((!staffRole&&!ap.no)||!ap.name||!ap.dept||!ap.phone)return fail(staffRole?'請填寫申請人的姓名、單位與聯絡電話。':'請填寫申請人的學號、姓名、系級與聯絡電話。');
    const purpose=v('a-purpose'),min=today();
    const base={...ap,type:t,purpose,createdAt:nowStr(),status:'pending'};
    let reqs=[];
    if(t==='item'){
      const codes=$$('input[name=a-code]:checked').map(x=>x.value),date=v('a-date');
      if(!codes.length)return fail('請至少勾選一項器材。');
      if(!date)return fail('請選擇使用日期。');
      if(date<min)return fail('使用日期不能早於今天。');
      if(dow(date)===0||dow(date)===6)return fail('使用日期須為週一至週五。');
      if(eventOn(date))return fail('這天是資源教室活動日，不開放借用，請改選其他日期。');
      reqs=codes.map(c=>({...base,id:newId(),code:c,itemName:item(c)?.name||c,date}));
    }else if(t==='leisure'||t==='space'){
      const code=($('input[name=a-code]:checked')||{}).value,date=v('a-date');
      if(!code)return fail(t==='space'?'請選擇空間。':'請選擇器材。');
      if(!date)return fail('請選擇使用日期。');
      if(date<min)return fail('使用日期不能早於今天。');
      if(dow(date)===0||dow(date)===6)return fail('使用日期須為週一至週五。');
      if(eventOn(date))return fail('這天是資源教室活動日，不開放借用，請改選其他日期。');
      let start,end;
      if(t==='leisure'){const s=leisureSlot(date);if(s===false)return fail('休閒性器材只在期中考第 10、11 週與期末考第 19 週開放。');start=s?s.start:'18:00';end=s?s.end:'20:00'}
      else{start=v('a-start');end=v('a-end');if(start>=end)return fail('結束時間須晚於開始時間。')}
      const clash=S.calendar.find(c=>c.code===code&&c.date===date&&overlap(start,end,c.start,c.end));
      if(clash)return fail(`這個時段已被預約（${clash.start}–${clash.end}），請改選其他時間。`);
      reqs=[{...base,id:newId(),code,itemName:item(code)?.name||code,date,start,end}];
    }else if(t==='long'){
      const code=v('a-code'),date=v('a-date'),endDate=v('a-end-date');
      if(!code)return fail('請選擇輔具。');
      if(!date||!endDate)return fail('請填寫開始日期與預計歸還日期。');
      if(endDate<date)return fail('預計歸還日期不能早於開始日期。');
      if(!purpose)return fail('長期借用請在用途說明填寫需要的原因。');
      reqs=[{...base,id:newId(),code,itemName:item(code)?.name||code,date,endDate}];
    }
    const btn=$('#a-submit');btn.disabled=true;btn.textContent='送出中…';
    try{
      await serial('req',async()=>{
        const ref=S.db.doc('requests/'+S.uid);const snap=await ref.get();
        const list=snap.exists?[...(snap.data().list||[])]:[];
        list.push(...reqs);
        await ref.set({list,updatedAt:nowStr()});
      });
      local.set('applicant',ap);S.preselect=null;
      toast(`已送出 ${reqs.length} 筆申請，請等候老師審核`);
      location.hash='mine';
    }catch(e){
      btn.disabled=false;btn.textContent='送出申請';
      err.textContent=e&&e.code==='invalid_argument'?'你目前的權限無法送出申請。請向資源教室老師確認此頁的分享權限需為「參與者」以上。':'送出失敗，請稍後再試一次。';
    }
  }
};

const surveyTarget=r=>r.code==='s01'?'悅讀書房':r.code==='s02'?'課輔室':r.type==='leisure'?'休閒性器材':'資源教室器材借用';
function pendingSurveyNote(){const n=S.myReq.filter(needSurvey).length;return n?`<div class="note warn"><b>你有 ${n} 筆借用已歸還、尚未填寫滿意度問卷。</b>${curView==='mine'?'請在下方對應的借用紀錄填寫':'請到<a href="#mine">學生/職員申請</a>填寫'}，填完後才能送出新的申請。</div>`:''}

      $('#m-find').onsubmit=async e=>{e.preventDefault();const no=$('#mf-no').value.trim(),ph=$('#mf-phone').value.trim();if(!no||!digits(ph)){$('#mf-err').textContent='請填寫學號（或教職員姓名）與電話。';return}await setIdentity(no,ph);this.paint()};
      return}
    $('#m-gate').innerHTML=gateNotice()+(S.gas?`<div class="spread note" style="margin-bottom:12px"><span>目前查詢：<b>${h(id.name||'')}</b> ${id.no!==id.name?`<span class="mono">${h(id.no)}</span>`:''}</span><button class="small" id="m-switch">不是你？切換身分</button></div>`:'')+pendingSurveyNote();
    if(S.gas)$('#m-switch').onclick=()=>clearIdentity();

<div class="meta"><span>使用日期 ${fmtDate(r.date)}${r.start?` <span class="mono">${r.start}–${r.end}</span>`:''}${r.endDate?` 至 ${fmtDate(r.endDate)}`:''}</span><span>申請於 <span class="mono">${h(r.createdAt)}</span></span></div>
${r.reviewNote?`<div class="note ${r.status==='rejected'?'bad':''}">老師備註：${h(r.reviewNote)}</div>`:''}
${r.status==='approved'?`<div class="note ok">請於 ${fmtDate(r.date)} 攜帶${r.role==='教職員'?'教職員證':'學生證'}到資源教室${sp(r)?'，由工讀生或老師協助開門':'領取'}。</div>`:''}
${r.status==='out'?`<div class="note info">${sp(r)?'開門時間':'領取時間'} <span class="mono">${h(r.outAt||'')}</span>${r.due?`・請於 <b>${fmtDate(r.due)}</b> 前${sp(r)?'使用完畢':'歸還'}`:''}${r.assetNo?`・編號 <span class="mono">${h(r.assetNo)}</span>`:''}</div>`:''}
${r.status==='returning'?`<div class="note info">你已於 <span class="mono">${h(r.returnRequestedAt||'')}</span> 確認${sp(r)?'使用完畢':'歸還'}。請${sp(r)?'到資源教室告知並領回證件':'把器材（含配件）帶回資源教室'}，由老師點收後完成。</div>`:''}
${r.status==='returned'?`<div class="note ${r.abnormal?'warn':'ok'}">歸還完成：<span class="mono">${h(r.returnedAt||'')}</span>${r.receiver?`・簽收人 ${h(r.receiver)}`:''}・狀況${r.abnormal?'異常':'正常'}${r.returnNote?`（${h(r.returnNote)}）`:''}</div>`:''}
${r.status==='returned'&&r.role!=='教職員'?(r.surveyed?`<div class="survey-state done"><b>✓ 滿意度問卷已填寫</b><span class="mono">${h(r.surveyedAt||'')}</span></div>`
  :`<div class="survey-state todo"><div class="spread"><b>滿意度問卷尚未填寫</b>${S.openSurvey===r.id?'':`<button class="primary small" data-survey="${h(r.id)}">填寫問卷（約 1 分鐘）</button>`}</div>
${S.openSurvey===r.id?`<form class="sv-form" data-for="${h(r.id)}" novalidate>${surveyBlock('sv')}<div class="row"><button class="primary" type="submit">送出問卷</button><button type="button" data-survey-close>收起</button></div></form>`:''}</div>`):''}
<div class="row">${['pending','approved'].includes(r.status)?`<button class="small danger" data-cancel="${h(r.id)}">取消申請</button>`:''}${r.status==='out'?`<button class="primary" data-ret="${h(r.id)}">${sp(r)?'確認使用完畢':'確認歸還'}</button>`:''}</div>
</article>`).join('');
    $('#m-list').onclick=e=>{const d=e.target.dataset;

      if(d.ret)confirmBox('確認歸還？','送出後請把器材（含配件）帶回資源教室，老師會和你一起清點狀況，點收後才算完成歸還。','確認歸還',()=>this.setStatus(d.ret,{status:'returning',returnRequestedAt:nowStr()},'已確認歸還，請帶回資源教室點收'));
      if(d.survey){S.openSurvey=d.survey;this.paint();const f=$(`.sv-form[data-for="${d.survey}"]`);f&&f.scrollIntoView({block:'nearest'})}
      if(e.target.dataset.surveyClose!==undefined){S.openSurvey=null;this.paint()}};
    $('#m-list').onsubmit=async e=>{e.preventDefault();const f=e.target.closest('.sv-form');if(!f)return;const r=S.myReq.find(x=>x.id===f.dataset.for);if(!r)return;
      const b=f.querySelector('button[type=submit]');b.disabled=true;if(await submitSurveyBlock(f,r,'sv')){S.openSurvey=null;toast('已收到問卷，謝謝你的回饋！')}else b.disabled=false};
  },

    catch(e){toast('更新失敗，請稍後再試')}
  }
};

/* ===== 設備使用登記（取代紙本「資源教室設備借用登記簿」） ===== */
const PCS=['01','02','03','04'];
const devText=e=>[e.pc?`電腦 ${e.pc}`:'',e.print?'印表機（彩色）':'',e.copy?'影印機（黑白）':'',e.scan?'掃描資料':'',e.paper?`紙張 ${e.paper} 張`:''].filter(Boolean).join('、');
const reasonText=e=>e.reason==='其他'?`其他：${e.reasonNote||''}`:e.reason;
V.usage={
  deps:['config'],

<label class="f" style="max-width:260px">紙張張數 <small>列印或影印用了幾張，沒有就留空</small><input type="number" id="u-paper" min="0" max="999" inputmode="numeric"></label>

  }

/* ===== 審核與點交 (admin) ===== */
function reqFlags(r,all){
  const f=[];const rm=rosterMap();
  if(r.role==='學生'){
    if(S.roster.length){const m=rm[r.no];if(!m)f.push(['學號不在借用名單','bad']);else f.push([m.name&&m.name!==r.name?`名單姓名為 ${m.name}`:'名單內',m.name&&m.name!==r.name?'warn':'ok'])}
  }else f.push(['教職員業務需求','']);
  const ev=eventOn(r.date);if(ev)f.push([`活動日：${ev.label}`,'bad']);
  if(r.type==='leisure'&&leisureSlot(r.date)===false)f.push(['不在開放週次','warn']);
  if(r.type==='space'||r.type==='leisure'){const c=S.calendar.find(c=>c.id!==r.id&&c.code===r.code&&c.date===r.date&&overlap(r.start,r.end,c.start,c.end));if(c)f.push([`時段衝突 ${c.start}–${c.end}`,'bad'])}
  if(r.type==='item'||r.type==='long'){
    const it=item(r.code);if(it){const end=dueFor(r);const busy=all.filter(o=>o.id!==r.id&&o.code===r.code&&['approved','out'].includes(o.status)&&o.date<=end&&dueFor(o)>=r.date).length;
    if(busy>=(it.qty||0))f.push([`同期間已借出／核准 ${busy} 件，庫存 ${it.qty||0}`,'bad']);else f.push([`同期間占用 ${busy}／${it.qty||0}`,''])}
  }
  return f.map(([t,c])=>`<span class="chip ${c}">${h(t)}</span>`).join('');
}
async function editReq(uid,id,patch){
  await serial('req-'+uid,async()=>{const ref=S.db.doc('requests/'+uid);const snap=await ref.get();if(!snap.exists)throw new Error('missing');
    const list=(snap.data().list||[]).map(r=>r.id===id?{...r,...patch}:r);await ref.set({...snap.data(),list,updatedAt:nowStr()})});
}

const LEDGER_ALIAS={applyDate:['申請日','申請日期'],date:['使用日期','日期','借用日期'],name:['借用人','姓名'],no:['學號','學號/員工編號','員工編號','學號／員工編號'],dept:['系級','系所','單位','系級/單位'],item:['借用品項','品項','器材','物品','借用物品'],
  assetNo:['財產/物品編號','財產編號','物品編號','財產／物品編號'],handler:['經手人'],due:['應還日期'],returnedAt:['歸還日期'],receiver:['簽收人'],note:['備註','說明']};
const ROSTER_COLS=[['no','學號'],['name','姓名'],['dept','系級'],['category','類別'],['validUntil','證明有效期限'],['note','備註']];
const ROSTER_ALIAS={no:['學號'],name:['姓名'],dept:['系級','系所','科系','班級','系級/單位'],category:['類別','障別','障礙類別','鑑輔會類別','身分類別'],validUntil:['證明有效期限','有效期限','鑑定有效期限'],note:['備註']};
function mapRows(rows,alias){
  if(!rows.length)return {out:[],used:[],unused:[]};
  const heads=Object.keys(rows[0]),norm=s=>String(s).replace(/\s/g,'');const map={},used=[];
  for(const [k,names] of Object.entries(alias)){const hd=heads.find(x=>names.map(norm).includes(norm(x)));if(hd){map[k]=hd;used.push(hd)}}
  const out=rows.map(r=>{const o={};for(const [k,hd] of Object.entries(map))o[k]=r[hd]==null?'':String(r[hd]).trim();return o});
  return {out,used,unused:heads.filter(x=>!used.includes(x)),map};
}
let xlsxP=null;
function loadXLSX(){if(window.XLSX)return Promise.resolve();if(!xlsxP)xlsxP=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=ok;sc.onerror=()=>{xlsxP=null;no(new Error('Excel 元件載入失敗'))};document.head.appendChild(sc)});return xlsxP}
async function readSheet(file){
  await loadXLSX();
  const buf=await file.arrayBuffer();
  const wb=file.name.toLowerCase().endsWith('.csv')?XLSX.read(new TextDecoder('utf-8').decode(buf).replace(/^﻿/,''),{type:'string',cellDates:true}):XLSX.read(buf,{type:'array',cellDates:true});
  const rows=[];for(const n of wb.SheetNames){const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:'',raw:true});const valid=r.filter(o=>Object.values(o).some(v=>String(v).trim()));rows.push(...valid);if(valid.length)break}
  return rows.map(o=>{const n={};for(const [k,v] of Object.entries(o))n[k]=v instanceof Date?ymd(v):v;return n});
}
let DL=null;
async function saveFile(filename,data){
  if(!DL){toast('這個檢視無法下載檔案，請在 claude.ai 開啟此頁');return}
  try{data=await data;await DL.save({filename,data});}catch(e){if(e&&e.code!=='declined')toast('下載失敗：'+(e.message||e.code))}
}
async function xlsxBlob(sheets){await loadXLSX();const wb=XLSX.utils.book_new();for(const [name,aoa,widths] of sheets){const ws=XLSX.utils.aoa_to_sheet(aoa);if(widths)ws['!cols']=widths.map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,name)}return new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})])}
async function batchWrite(docs,label,onProgress){let done=0;
  if(S.db.batch){for(let i=0;i<docs.length;i+=100){await S.db.batch(docs.slice(i,i+100));done+=Math.min(100,docs.length-i);onProgress&&onProgress(done)}return}
  for(let i=0;i<docs.length;i+=8){await Promise.all(docs.slice(i,i+8).map(([p,d])=>S.db.doc(p).set(d)));done+=Math.min(8,docs.length-i);onProgress&&onProgress(done)}}
function importDialog(kind){
  const L=kind==='ledger';const alias=L?LEDGER_ALIAS:ROSTER_ALIAS,cols=L?LEDGER_COLS.filter(c=>c[0]!=='outAt'&&c[0]!=='statusText'):ROSTER_COLS;

<p class="mono" style="margin:0;color:var(--muted);font-size:.8rem">${cols.map(c=>c[1]).join('、')}</p>
<div class="row"><button class="small" id="im-tpl">下載空白範本 (.xlsx)</button></div>
<label class="f">選擇檔案（.xlsx、.xls、.csv）<input type="file" id="im-file" accept=".xlsx,.xls,.csv"></label>
${L?'':`<label class="choice"><input type="checkbox" id="im-replace"><span><b>先清空現有名單再匯入</b><small>新學年更新名單時使用</small></span></label>`}
<div id="im-prev"></div><p class="err" id="im-err"></p>
<div class="row"><button class="primary" id="im-ok" disabled>確認匯入</button><button data-close>取消</button></div>`,m=>{
  let rows=[];
  m.querySelector('#im-tpl').onclick=()=>saveFile(L?'設備借用紀錄範本.xlsx':'借用名單範本.xlsx',xlsxBlob([[L?'設備借用紀錄':'名單',[cols.map(c=>c[1])],cols.map(()=>14)]]));
  m.querySelector('#im-file').onchange=async e=>{
    const f=e.target.files[0];$('#im-err').textContent='';$('#im-prev').innerHTML='';$('#im-ok').disabled=true;if(!f)return;
    try{
      const raw=await readSheet(f),r=mapRows(raw,alias);
      rows=r.out.filter(o=>L?(o.name||o.item):o.no);
      if(!r.used.length){$('#im-err').textContent='找不到可辨識的欄位名稱，請確認第一列是欄位標題（可參考範本）。';return}
      if(L)rows.forEach(o=>{for(const k of ['applyDate','date','due','returnedAt'])o[k]=normDate(o[k])});
      else rows.forEach(o=>{o.no=o.no.toUpperCase().replace(/\s/g,'');o.validUntil=normDate(o.validUntil)});
      const show=cols.filter(c=>r.map[c[0]]);
      $('#im-prev').innerHTML=`<div class="note ok">讀到 <b>${rows.length}</b> 筆資料。${r.unused.length?`未使用的欄位：${h(r.unused.join('、'))}`:''}</div>
<div class="tablewrap" style="max-height:240px;margin-top:8px"><table><thead><tr>${show.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,8).map(o=>`<tr>${show.map(c=>`<td>${h(o[c[0]])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${rows.length>8?`<p class="meta">僅顯示前 8 筆</p>`:''}`;
      $('#im-ok').disabled=!rows.length;
    }catch(err){$('#im-err').textContent='檔案無法讀取，請確認是 Excel 或 CSV 格式。'}
  };
  m.querySelector('#im-ok').onclick=async()=>{
    const btn=$('#im-ok');btn.disabled=true;
    try{
      if(L){const docs=rows.map(o=>{const id=newId();return ['loans/'+id,{...o,id,source:'import',status:o.returnedAt?'returned':'out',importedAt:nowStr()}]});

        const docs=rows.filter(o=>/^[A-Za-z0-9_\-.]+$/.test(o.no)).map(o=>['roster/'+o.no,{...o,updatedAt:nowStr()}]);
        await batchWrite(docs,'',n=>btn.textContent=`匯入中 ${n}/${docs.length}`);
      }
      closeModal();toast(`已匯入 ${rows.length} 筆`);
    }catch(e){btn.disabled=false;btn.textContent='確認匯入';$('#im-err').textContent=e&&e.code==='quota_exceeded'?'資料量已達上限，請先刪除部分舊資料。':'匯入中斷，部分資料可能已寫入，請檢查後再試。'}
  }})

let qrP=null;
function loadQR(){if(window.qrcode)return Promise.resolve();if(!qrP)qrP=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';sc.onload=ok;sc.onerror=()=>{qrP=null;no()};document.head.appendChild(sc)});return qrP}
function qrSvg(text){const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}
async function qrPng(text,title,sub){await loadQR();
  const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),cell=10,m=4*cell,size=n*cell+m*2,W=size,H=size+110;
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#111';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))g.fillRect(m+k*cell,m+r*cell,cell,cell);
  g.textAlign='center';g.font='bold 30px "Noto Sans TC",sans-serif';g.fillText(title,W/2,size+38);g.font='22px "Noto Sans TC",sans-serif';g.fillStyle='#444';g.fillText(sub,W/2,size+76);
  return await new Promise(res=>c.toBlob(res,'image/png'));
}

function makeDemoDb(){
  const KEY='rr-demo-db';let data=local.get(KEY);
  if(!data){data={};DEMO_CATALOG.forEach(c=>data['catalog/'+c.code]={...c});data['config/site']={url:'',semesterStart:'',office:'',eventDays:[]}}
  const L=new Set(),clone=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
  const save=()=>{local.set(KEY,data);setTimeout(()=>L.forEach(f=>f()),0)};
  const meta={fromCache:false,hasPendingWrites:false};
  const snap=p=>({id:p.split('/').pop(),exists:p in data,data:()=>clone(data[p]),metadata:meta});
  const merge=(t,s)=>{for(const[k,v]of Object.entries(s)){if(v&&typeof v==='object'&&!Array.isArray(v)&&t[k]&&typeof t[k]==='object'&&!Array.isArray(t[k]))merge(t[k],v);else t[k]=clone(v)}};
  const doc=p=>({id:p.split('/').pop(),path:p,get:async()=>snap(p),
    set:async d=>{data[p]=clone(d);save()},
    update:async d=>{if(!(p in data))throw{code:'invalid_argument',message:'missing'};merge(data[p],d);save()},
    delete:async()=>{delete data[p];save()},
    onSnapshot(next){const f=()=>next(snap(p));L.add(f);setTimeout(f,0);return()=>L.delete(f)},
    collection:sub=>col(p+'/'+sub)});
  const qs=p=>{const n=p.split('/').length+1;const docs=Object.keys(data).filter(k=>k.startsWith(p+'/')&&k.split('/').length===n).sort().map(snap);return{docs,size:docs.length,empty:!docs.length,metadata:meta,docChanges:()=>[]}};
  const col=p=>({path:p,doc:id=>doc(p+'/'+(id||newId())),get:async()=>qs(p),add:async d=>{const r=doc(p+'/'+newId());await r.set(d);return r},
    onSnapshot(next){const f=()=>next(qs(p));L.add(f);setTimeout(f,0);return()=>L.delete(f)}});
  return{doc,collection:col,reset(){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}};
}

/* ---------- Google 試算表資料庫（GitHub Pages 正式版） ---------- */
function makeGasDb(api){
  const subs=new Set();let timer=null,inflight=false,again=false,saveT=null,pend=0,chain=Promise.resolve();
  const meta={fromCache:false,hasPendingWrites:false},PUB=['catalog','config','calendar'];
  const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
  const cache={},loadedCols=new Set();
  try{const c=JSON.parse(localStorage.getItem('rr-cache')||'{}');Object.assign(cache,c.docs||{});(c.cols||[]).forEach(x=>loadedCols.add(x))}catch(e){}
  const keep=k=>PUB.includes(k.split('/')[0])||(S.uid&&k==='requests/'+S.uid);
  const persist=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{const docs={};for(const k in cache)if(keep(k))docs[k]=cache[k];
    try{localStorage.setItem('rr-cache',JSON.stringify({docs,cols:[...loadedCols].filter(c=>PUB.includes(c))}))}catch(e){}},300)};
  const call=async body=>{
    const r=await fetch(api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,uid:S.uid||'',pw:sess.get('rr-pw')||undefined})});
    let j;try{j=await r.json()}catch(e){throw{code:'unavailable',message:'伺服器沒有回應'}}
    if(!j.ok)throw{code:j.code||'unavailable',message:j.message||''};return j};
  const snap=(path,data)=>({id:path.split('/').pop(),exists:data!=null,data:()=>clone(data)??undefined,metadata:meta});
  const colDocs=p=>{const n=p.split('/').length+1;return Object.keys(cache).filter(k=>k.startsWith(p+'/')&&k.split('/').length===n&&cache[k]!=null).sort().map(k=>snap(k,cache[k]))};
  function emit(x,force){
    if(x.kind==='doc'){if(!(x.path in cache))return;const key=JSON.stringify(cache[x.path]);if(!force&&key===x.last)return;x.last=key;x.next(snap(x.path,cache[x.path]))}
    else{if(!loadedCols.has(x.path))return;const docs=colDocs(x.path);const key=JSON.stringify(docs.map(d=>[d.id,cache[x.path+'/'+d.id]]));if(!force&&key===x.last)return;x.last=key;
      x.next({docs,size:docs.length,empty:!docs.length,metadata:meta,docChanges:()=>[]})}
  }
  const emitAll=()=>subs.forEach(x=>emit(x));
  async function refresh(){
    if(pend>0)return;if(inflight){again=true;return}const list=[...subs];if(!list.length)return;inflight=true;
    try{const j=await call({op:'read',reads:list.map(x=>({kind:x.kind,path:x.path}))});
      j.results.forEach((res,i)=>{const x=list[i];
        if(x.kind==='doc')cache[x.path]=res.data;
        else{const n=x.path.split('/').length+1,seen=new Set();(res.docs||[]).forEach(d=>{const k=x.path+'/'+d.id;cache[k]=d.data;seen.add(k)});
          Object.keys(cache).forEach(k=>{if(k.startsWith(x.path+'/')&&k.split('/').length===n&&!seen.has(k))delete cache[k]});loadedCols.add(x.path)}});
      if(pend>0){again=true;return}
      persist();emitAll();
      if(S.offline){S.offline=false;repaint(['config','myReq'])}
    }catch(e){if(!S.offline){S.offline=true;repaint(['config','myReq'])}}
    finally{inflight=false;if(again){again=false;refresh()}}
  }
  const soon=(ms=40)=>{clearTimeout(timer);timer=setTimeout(refresh,ms)};
  setInterval(()=>{if(document.visibilityState!=='hidden')refresh()},10000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});
  const sub=(kind,path,next)=>{const x={kind,path,next};subs.add(x);setTimeout(()=>emit(x,true),0);soon();return()=>subs.delete(x)};
  const merge=(t,src)=>{for(const[k,v]of Object.entries(src)){if(v&&typeof v==='object'&&!Array.isArray(v)&&t[k]&&typeof t[k]==='object'&&!Array.isArray(t[k]))merge(t[k],v);else t[k]=clone(v)}return t};
  /* 先更新畫面，再送到 Google；失敗就還原 */
  /* 寫入依序送出、不擋畫面；失敗時提示並重新讀取 */
  function send(body){pend++;chain=chain.then(()=>call(body)).then(()=>{persist()},e=>{toast(e&&e.message&&e.code!=='unavailable'?'儲存失敗：'+e.message:'有資料沒有存到資料庫，請檢查網路後重試');loadedCols.clear();Object.keys(cache).forEach(k=>delete cache[k])})
    .finally(()=>{pend--;if(!pend)soon(150)});return chain}
  async function write(op,path,data){
    if(op==='update'&&cache[path]==null&&!(path in cache)){const d=(await call({op:'get',path})).data;cache[path]=d}
    if(op==='update'&&cache[path]==null)throw{code:'invalid_argument',message:'missing'};
    if(op==='set')cache[path]=clone(data);else if(op==='update')cache[path]=merge(clone(cache[path]),data);else cache[path]=null;
    emitAll();send({op,path,data});
  }
  const watched=p=>[...subs].some(x=>x.kind==='doc'?x.path===p:p.startsWith(x.path+'/')&&loadedCols.has(x.path));
  const doc=p=>({id:p.split('/').pop(),path:p,
    get:async()=>{if(p in cache&&watched(p))return snap(p,cache[p]);const d=(await call({op:'get',path:p})).data;cache[p]=d;return snap(p,d)},
    set:d=>write('set',p,d),update:d=>write('update',p,d),delete:()=>write('delete',p),
    onSnapshot:(next,err)=>sub('doc',p,next),collection:c=>col(p+'/'+c)});
  const col=p=>({path:p,doc:id=>doc(p+'/'+(id||newId())),
    get:async()=>{const j=await call({op:'read',reads:[{kind:'col',path:p}]});const docs=j.results[0].docs.map(d=>snap(p+'/'+d.id,d.data));return{docs,size:docs.length,empty:!docs.length,metadata:meta}},
    onSnapshot:(next,err)=>sub('col',p,next)});
  return{doc,collection:col,refresh,
    forget(prefix){Object.keys(cache).forEach(k=>{if(k.startsWith(prefix))delete cache[k]});persist()},
    batch:async writes=>{writes.forEach(([path,data])=>cache[path]=clone(data));emitAll();await send({op:'batch',writes:writes.map(([path,data])=>({op:'set',path,data}))})},
    login:async pw=>{try{const r=await fetch(api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({op:'login',pw})});return !!(await r.json()).ok}catch(e){throw{code:'unavailable'}}}};
}
const digits=s=>String(s||'').replace(/\D/g,'');
async function setIdentity(no,phone,name){
  const uid='u'+await sha(String(no).toUpperCase().trim()+'|'+digits(phone));
  local.set('rr-id',{uid,no:String(no).toUpperCase().trim(),name:name||''});
  if(uid!==S.uid){S.uid=uid;subMine()}
  return uid;
}
function clearIdentity(){try{localStorage.removeItem('rr-id')}catch(e){}if(S.db&&S.db.forget)S.db.forget('requests/');S.uid=null;S.myReq=[];if(S.mineUnsub){S.mineUnsub();S.mineUnsub=null}S.got.myReq=false;route()}
function anonUid(){let a=local.get('rr-anon');if(!a){const b=new Uint8Array(32);crypto.getRandomValues(b);a='u'+[...b].map(x=>x.toString(16).padStart(2,'0')).join('');local.set('rr-anon',a)}return a}
function subMine(){
  if(S.mineUnsub){S.mineUnsub();S.mineUnsub=null}
  S.myReq=[];S.got.myReq=false;
  if(!S.db||!S.uid)return;
  S.mineUnsub=S.db.doc('requests/'+S.uid).onSnapshot(s=>{S.myReq=s.exists?(s.data().list||[]):[];S.got.myReq=true;repaint(['myReq']);maybeSurveyPopup()},()=>{S.got.myReq=true;repaint(['myReq'])});
}

/* ---------- boot ---------- */
route();
(async()=>{
  const C=window.claude;let db,user,dl;
  const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
  if(!C||!C.use){
    if(inFrame){S.noDb=true;S.ready=true;repaint(['config']);return}
    if(API_URL){S.gas=true;db=makeGasDb(API_URL);dl=demoDownloads;const id=local.get('rr-id');user={id:async()=>id&&id.uid||null,canEdit:async()=>true}}
    else{S.demo=true;db=makeDemoDb();dl=demoDownloads;user={id:async()=>'demo-user',canEdit:async()=>true};demoBanner(db);
    db.doc('config/site').get().then(sn=>{const c=sn.data()||{};if(!c.url)db.doc('config/site').set({...c,url:location.origin+location.pathname})})}
  }else [db,user,dl]=await Promise.all([C.use('db'),C.use('user'),C.use('downloads')]);
  DL=dl;S.db=db;S.user=user;
  if(!db){S.noDb=true;S.ready=true;repaint(['config','myReq']);route();return}
  if(user){try{S.uid=await user.id()}catch(e){} try{S.editor=!!(await user.canEdit())}catch(e){}}
  S.admin=S.gas?!!sess.get('rr-pw'):S.editor&&sess.get('rr-unlock')===PASS_HASH;
  S.ready=true;
  const timer=setTimeout(()=>{if(!S.got.catalog){S.stale=true;repaint(['config','catalog','myReq'])}},10000);
  const done=k=>{S.got[k]=true;if(k==='catalog'){clearTimeout(timer);S.stale=false}repaint([k])};
  const fail=k=>e=>{S.got[k]=true;repaint([k])};
  db.collection('catalog').onSnapshot(s=>{S.catalog=s.docs.map(d=>d.data()).sort((a,b)=>(a.sort||0)-(b.sort||0));if(!s.metadata.fromCache)done('catalog');else repaint(['catalog'])},fail('catalog'));
  db.doc('config/site').onSnapshot(s=>{S.config=s.exists?{...s.data()}:{};done('config')},fail('config'));
  db.collection('calendar').onSnapshot(s=>{S.calendar=s.docs.map(d=>({id:d.id,...d.data()}));done('calendar')},fail('calendar'));
  subMine();
  if(S.admin)startAdmin();
  route();
})();
